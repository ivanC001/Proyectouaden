name: Hostinger - simulación de HTML
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'deploy/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-html-simulation
  cancel-in-progress: true
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar lista explícita sin conectar al servidor
        run: node deploy/plan.mjs
      - name: Mostrar manifiesto
        run: cat deploy-output/plan.json
      # Intencionalmente no hay SSH, SFTP, rsync ni acceso a secrets.
